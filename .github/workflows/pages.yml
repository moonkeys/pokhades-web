# Publie le jeu sur GitHub Pages à chaque push sur main.
# Dans le dépôt GitHub : Settings → Pages → Source : « GitHub Actions ».
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Une page de projet est servie sous /<dépôt>/ (vite.config.ts, BASE_PATH).
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Dernier chiffre de la version affichée au menu : monte à chaque mise en prod.
          DEPLOY_NUMBER: ${{ github.run_number }}
          # Multijoueur (net/net.ts) : adresse du Worker Cloudflare qui fabrique les identifiants du
          # relais TURN (worker/turn-worker.js). À définir dans Settings → Secrets and variables →
          # Actions → Variables (TURN_ENDPOINT). Sans lui, pas de relais.
          VITE_TURN_ENDPOINT: ${{ vars.TURN_ENDPOINT }}
